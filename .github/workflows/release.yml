name: Release

on:
  push:
    tags:
      # Strict semver tags only: v1.2.3. Excludes v1.2.3-rc1 etc. by design.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  # Needed for goreleaser to create the GitHub Release in this repo.
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # goreleaser needs the tags and full history to work out the version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build release notes from changelog
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"

          # Take this tag's section only: everything below the "## <tag>" heading
          # up to the next "## " heading. The heading itself is dropped, since
          # GitHub already shows the version and date above the body.
          #
          # Matching is a literal prefix comparison rather than a regex, so the
          # dots in a version cannot match other characters. It is written
          # outside the repository to leave goreleaser a clean working tree.
          awk -v tag="${GITHUB_REF_NAME}" '
            BEGIN { needle = "## " tag }
            {
              if (!found && substr($0, 1, length(needle)) == needle) {
                rest = substr($0, length(needle) + 1)
                if (rest == "" || substr(rest, 1, 1) == " ") { found = 1; next }
              }
              if (found && substr($0, 1, 3) == "## ") { exit }
              if (found) print
            }
          ' changelog.md > "$notes"

          # Fail loudly rather than publish a release that says nothing.
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::changelog.md has no entry for ${GITHUB_REF_NAME}. Add a '## ${GITHUB_REF_NAME} (YYYY-MM-DD)' section before tagging."
            exit 1
          fi

          printf '\n---\nReleased by [GoReleaser](https://github.com/goreleaser/goreleaser).\n' >> "$notes"

          echo "Release notes for ${GITHUB_REF_NAME}:"
          echo "----------------------------------------"
          cat "$notes"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          # Default token: enough to publish the release to vieolo/contour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to vieolo/homebrew-tap. See repo Settings → Secrets.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
